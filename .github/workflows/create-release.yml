---
name: "Create Release"

on:
    # Dispatch against the tag ref itself, not a branch: the tests below are a local
    # reusable workflow, so they always run at this workflow's ref. Releasing a tag
    # while testing a branch would publish code that was never tested.
    workflow_dispatch:
    push:
        tags:
            - "v*"

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

permissions:
    contents: write

jobs:
    run-tests:
        uses: ./.github/workflows/reusable-tests.yml
        secrets: inherit

    autorelease:
        name: Create Release
        runs-on: "ubuntu-latest"
        needs: run-tests
        steps:
            - name: Checkout repository
              uses: actions/checkout@v7

            - name: Read plugin version
              run: |
                  PLUGIN_VERSION=$(jq -r '.version' plugins/natelandau-toolkit/.claude-plugin/plugin.json)
                  echo "PLUGIN_VERSION=$PLUGIN_VERSION" >> "$GITHUB_ENV"

            - name: Check tag matches plugin version
              env:
                  REF_NAME: ${{ github.ref_name }}
                  REF_TYPE: ${{ github.ref_type }}
              run: |
                  if [[ "$REF_TYPE" != "tag" ]]; then
                      echo "::error::Run this workflow against a tag ref; got $REF_TYPE $REF_NAME"
                      exit 1
                  fi

                  echo "Tag: $REF_NAME"
                  echo "Plugin version: $PLUGIN_VERSION"
                  if [[ "$REF_NAME" != "v$PLUGIN_VERSION" ]]; then
                      echo "::error::Tag $REF_NAME does not match plugin version v$PLUGIN_VERSION"
                      exit 1
                  fi

            - name: Get notes
              id: generate_notes
              uses: anmarkoulis/commitizen-changelog-reader@master
              with:
                  tag_name: refs/tags/v${{ env.PLUGIN_VERSION }}
                  changelog: CHANGELOG.md

            - name: Create Release
              uses: softprops/action-gh-release@v3
              with:
                  tag_name: ${{ github.ref_name }}
                  body: ${{join(fromJson(steps.generate_notes.outputs.notes).notes, '')}}
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    publish-to-pypi:
        runs-on: ubuntu-latest
        needs: [run-tests, autorelease]
        env:
            TWINE_USERNAME: ${{ secrets.TWINE_USERNAME }}
            TWINE_PASSWORD: ${{ secrets.TWINE_PASSWORD }}
        steps:
            - name: Checkout repository
              uses: actions/checkout@v7

            - name: Setup Python, uv, and the package
              uses: ./.github/actions/setup_python_env
              with:
                  python-version: "3.13"

            - name: Build the package
              shell: bash
              run: uv build

            - name: Upload to PyPi
              shell: bash
              run: uvx twine upload dist/*
