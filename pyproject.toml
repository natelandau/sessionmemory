[project]
    authors = [{ name = "Nathaniel Landau", email = "github@natelandau.com" }]
    dependencies = [
        "fastembed>=0.8.0",
        "nclutils>=3.4.4",
        "pyyaml>=6.0.3",
        "sqlite-vec>=0.1.9",
        "tomli-w>=1.2.0",
        "typer>=0.27.2",
    ]
    description = "Durable memory for coding agents, one folder of searchable pages per project."
    name = "sessionmemory"
    readme = "README.md"
    requires-python = ">=3.13,<3.15"
    version = "0.2.0"

    [project.scripts]
        sessionmemory = "sessionmemory.cli:main"

[dependency-groups]
    dev = [
        "commitizen>=4.18.0",
        "coverage>=7.16.0",
        "duty>=1.9.0",
        "prek>=0.5.2",
        "pytest-clarity>=1.0.1",
        "pytest-cov>=7.1.0",
        "pytest-devtools>=1.3.0",
        "pytest-mock>=3.15.1",
        "pytest-xdist>=3.8.0",
        "pytest>=9.1.1",
        "rich>=15.0.0",
        "ruff>=0.16.5",
        "shellcheck-py>=0.11.0.1",
        "ty>=0.0.78",
        "types-pyyaml>=6.0.12.20260815",
        "typos>=1.50.1",
        "yamllint>=1.38.0",
    ]

[build-system]
    build-backend = "uv_build"
    requires      = ["uv_build>=0.12.5,<0.13.0"]

[tool.commitizen]
    bump_message               = "bump(release): v$current_version → v$new_version"
    changelog_merge_prerelease = true
    tag_format                 = "v$version"
    update_changelog_on_bump   = true
    version_provider           = "uv"

[tool.coverage.report] # https://coverage.readthedocs.io/en/latest/config.html#report
    exclude_lines = [
        'def __repr__',
        'except [\w\s\._]+ as .*:',
        'if TYPE_CHECKING',
        'pragma: no cover',
    ]
    fail_under = 95
    show_missing = true
    skip_covered = true
    skip_empty = true

[tool.coverage.run]
    branch       = true
    command_line = "--module pytest"
    data_file    = ".cache/coverage"
    # The three hook entry points below are executed only as real subprocesses, by
    # `tests/plugin/test_hooks.py` and `test_vault_path.py`. They run under `uv run
    # --script` in an environment that has no coverage installed, so coverage cannot
    # observe them and reports 0% for code the suite genuinely exercises. Measuring
    # them would make the gate report a testing gap that is really a measurement one.
    # `sessionstart.py` is not listed: its module level is imported by tests, so it
    # stays measured, and only its subprocess-only `main` carries a pragma.
    omit   = ["hooks/precompact.py", "hooks/sessionend.py", "hooks/vault-path.py", "tests/*"]
    source = ["hooks", "src"]

[tool.coverage.xml]
    output = ".cache/coverage.xml"

[tool.pytest.ini_options]

    addopts        = "--color=yes --doctest-modules --strict-config --strict-markers -n auto --dist loadfile"
    cache_dir      = ".cache/pytest"
    cli_runner_patch_result = true
    columns        = 1000
    filterwarnings = ['error', 'ignore:.*Pydantic.*:UserWarning', 'ignore::DeprecationWarning:']
    markers        = ["serial"]
    set_columns    = true
    testpaths      = ["tests"]
    xfail_strict   = true

[tool.ruff] # https://github.com/charliermarsh/ruff

    exclude        = [".cache", ".git", ".venv", "build", "dist", "reference"]
    fix            = true
    line-length    = 100
    output-format  = "grouped"
    src            = ["src", "tests"]
    target-version = "py313"
    [tool.ruff.lint]
        ignore = [
            "ANN002",  # Missing type annotation for `*args`
            "ANN003",  # Missing type annotation for `**kwargs`
            "ANN204",  # missing return type annotation for special method `__init__`
            "COM812",  # Trailing comma missing"
            "CPY001",  # Missing copyright notice at top of file
            "D107",    # undocumented-public-init
            "E501",    # line-too-long
            "FIX002",  # Line contains TODO, consider resolving the issue
            "PLC0415", # Imports should be at top of file
            "S311",    # suspicious-non-cryptographic-random-usage
            "TD001",   # invalid-todo-tag
            "TD002",   # Missing author in TODO
            "TD003",   # Missing issue link on the line following this TODO
        ]
        per-file-ignores = { "tests/**/*.py" = [
            "A002",
            "A003",
            "ANN001",  # Missing type annotation for function argument `cls`
            "ANN002",  # Missing type annotation for `*args`
            "ANN003",  # Missing type annotation for `**kwargs`
            "ANN201",  # Missing return type annotation
            "ARG001",  # Unused function argument
            "ARG002",  # Unused method argument
            "ARG005",  # Unused lambda argument
            "D102",
            "ERA001",  # Commented out code
            "F403",
            "F405",    # May be undefined from type imports
            "FBT001",  # Boolean-typed positional argument in function definition
            "PGH003",  # Use specific rule codes when ignoring type issues
            "PLC0415", # Imports should be at top of file
            "PLR0913",
            "PLR0917", # Too many positional arguments
            "PLR2004",
            "PLW0108", # Lambda may be unnecessary; consider inlining inner function
            "S101",
            "S603",
            "S607",
            "SLF001",  # Calling private method
            "W292",    # No blank line at end of file - included b/c cursor struggles to add a trailing newline and burns through requests trying to fix this linting error.
        ] }
        select = ["ALL"]
        unfixable = [
            "ERA001", # Commented out code
            "F401",   # unused-import
            "F841",   # unused-variable
        ]

        [tool.ruff.lint.mccabe]
            max-complexity = 10

        [tool.ruff.lint.pydocstyle]
            convention = "google"

        [tool.ruff.lint.pylint]
            max-args = 7

        [tool.ruff.lint.flake8-annotations]
            allow-star-arg-any = true

    [tool.ruff.format]
        indent-style              = "space"
        line-ending               = "auto"
        quote-style               = "double"
        skip-magic-trailing-comma = false

[tool.ty.terminal]
    error-on-warning = true

[tool.ty.environment]
    extra-paths = ["hooks/"]
